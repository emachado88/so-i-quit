name: Run Tests (check coverage)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "26"
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test:coverage
