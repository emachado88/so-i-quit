# CD: signed release artifacts for production, built on demand.
#
#   - Android: `assembleRelease` APK + `bundleRelease` AAB, signed with the
#     upload keystore from GitHub secrets — never committed, masked in logs.
#     The keystore/keystore.properties materialize only inside the ephemeral
#     runner, inside android/ (gitignored) for the duration of the job.
#
# Trigger: workflow_dispatch only — release builds are on-demand (same
# rationale as mobile-preview.yml: `ci` already gates PRs, and nothing
# should produce signed production artifacts without an explicit ask).
# An iOS job (signed device IPA) gets added here when an Apple Developer
# account exists — see the secrets list in the header comment.
#
# Required secrets (repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore (so-i-quit-upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD       key password
#
# Artifact names embed the app version read from package.json (keep it in
# sync with android/app/build.gradle versionName + iOS MARKETING_VERSION).
name: Mobile Release

on:
  workflow_dispatch:

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (signed release APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets (SPA)
        run: npx nuxt generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Materialize signing material
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The keystore never touches git or logs: decode to a build-time
          # file, write keystore.properties (gitignored), then drop the
          # base64 from the environment.
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/so-i-quit-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=so-i-quit-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          unset ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

      - name: Build signed release (APK + AAB)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        working-directory: android/app/build/outputs
        run: |
          mv apk/release/app-release.apk apk/release/so-i-quit-${{ steps.version.outputs.version }}-release.apk
          mv bundle/release/app-release.aab bundle/release/so-i-quit-${{ steps.version.outputs.version }}-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: so-i-quit-${{ steps.version.outputs.version }}-release.apk
          path: android/app/build/outputs/apk/release/so-i-quit-${{ steps.version.outputs.version }}-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: so-i-quit-${{ steps.version.outputs.version }}-release.aab
          path: android/app/build/outputs/bundle/release/so-i-quit-${{ steps.version.outputs.version }}-release.aab
          if-no-files-found: error
