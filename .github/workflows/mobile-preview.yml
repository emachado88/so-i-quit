# CD: preview installers for QA/sideload, built on demand.
#
#   - Android: `preview` variant APK (debug-keystore-signed, installable on
#     any device without a dedicated keystore) — com.soiquit.app.preview.
#   - iOS: unsigned simulator .app (installable via Xcode/simctl). A signed
#     device IPA needs an Apple Developer account + certificates — add a
#     signing job (secrets: P12, provisioning profile) when that exists.
#     Artifact gotcha: GitHub's download wrapper strips executable bits
#     (breaking .app bundles), so the job ships App.app inside a single
#     tar.gz (upload-artifact v7 with `archive: false` keeps it as-is).
#     Download → tar -xzf so-i-quit-<v>-simulator.app.tar.gz → App.app
#     (permissions/symlinks intact). If the GitHub UI wraps the download
#     in an extra zip, unzip first, then tar -xzf (pending real
#     workflow_dispatch validation).
#
# Trigger: workflow_dispatch only — previews are on-demand, not per-PR. The
# `ci` workflow already gates PRs (lint/tsc/test/build), and macOS runner
# minutes are expensive. The `platforms` input picks which jobs run, so a
# quick Android-only preview never touches the macOS job.
#
# Artifact names embed the app version read from package.json (keep it in
# sync with android/app/build.gradle versionName + iOS MARKETING_VERSION).
name: Mobile Preview

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: both
        options:
          - android
          - ios
          - both

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (preview APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.platforms == 'android' || inputs.platforms == 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 requires Java 21 (sourceCompatibility VERSION_21)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets (SPA)
        run: npx nuxt generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build preview APK
        working-directory: android
        run: ./gradlew assemblePreview

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/preview
        run: mv app-preview.apk so-i-quit-${{ steps.version.outputs.version }}-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: so-i-quit-${{ steps.version.outputs.version }}-preview.apk
          path: android/app/build/outputs/apk/preview/so-i-quit-${{ steps.version.outputs.version }}-preview.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator .app)
    runs-on: macos-15 # Xcode required — does not exist on Linux runners
    timeout-minutes: 40
    if: ${{ inputs.platforms == 'ios' || inputs.platforms == 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets (SPA)
        run: npx nuxt generate

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for simulator (unsigned)
        working-directory: ios/App
        run: |
          # SPM-based project (CapApp-SPM, no Podfile) — there is no
          # App.xcworkspace; build via the .xcodeproj directly.
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Package .app
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: |
          # tar.gz, not zip: preserves permissions, symlinks and case, which
          # the GitHub artifact wrapper would strip. Uploaded with
          # `archive: false` so the artifact IS this tar.gz (see header).
          tar -czf so-i-quit-${{ steps.version.outputs.version }}-simulator.app.tar.gz App.app

      - name: Upload .app
        uses: actions/upload-artifact@v7
        with:
          # `archive: false` keeps the artifact as the raw tar.gz (no extra
          # zip layer). Download → tar -xzf → App.app intact. If the GitHub
          # UI still wraps the download in a zip, unzip first, then tar -xzf.
          name: so-i-quit-${{ steps.version.outputs.version }}-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/so-i-quit-${{ steps.version.outputs.version }}-simulator.app.tar.gz
          archive: false
          if-no-files-found: error
