# CD: preview installers for QA/sideload, built on demand.
#
#   - Android: `preview` variant APK (debug-keystore-signed, installable on
#     any device without a dedicated keystore) — com.soiquit.app.preview.
#   - iOS: unsigned simulator .app (installable via Xcode/simctl). A signed
#     device IPA needs an Apple Developer account + certificates — add a
#     signing job (secrets: P12, provisioning profile) when that exists.
#     Artifact gotcha: GitHub wraps every artifact download in a zip AND its
#     wrapper strips executable bits (breaking .app bundles), so the job
#     pre-zips App.app itself (ditto) and the download is a zip-in-zip:
#     so-i-quit-<v>-simulator.zip → so-i-quit-<v>-simulator.app.zip → App.app.
#
# Trigger: workflow_dispatch only — previews are on-demand, not per-PR. The
# `ci` workflow already gates PRs (lint/tsc/test/build), and macOS runner
# minutes are expensive. The `platforms` input picks which jobs run, so a
# quick Android-only preview never touches the macOS job.
#
# Artifact names embed the app version read from package.json (keep it in
# sync with android/app/build.gradle versionName + iOS MARKETING_VERSION).
name: Mobile Preview

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: both
        options:
          - android
          - ios
          - both

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (preview APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.platforms == 'android' || inputs.platforms == 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 requires Java 21 (sourceCompatibility VERSION_21)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets (SPA)
        run: npx nuxt generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build preview APK
        working-directory: android
        run: ./gradlew assemblePreview

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/preview
        run: mv app-preview.apk so-i-quit-${{ steps.version.outputs.version }}-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: so-i-quit-${{ steps.version.outputs.version }}-preview
          path: android/app/build/outputs/apk/preview/so-i-quit-${{ steps.version.outputs.version }}-preview.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator .app)
    runs-on: macos-15 # Xcode required — does not exist on Linux runners
    timeout-minutes: 40
    if: ${{ inputs.platforms == 'ios' || inputs.platforms == 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets (SPA)
        run: npx nuxt generate

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for simulator (unsigned)
        working-directory: ios/App
        run: |
          # SPM-based project (CapApp-SPM, no Podfile) — there is no
          # App.xcworkspace; build via the .xcodeproj directly.
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Package .app
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: |
          # ditto, not zip -r: macOS-correct for .app bundles — preserves the
          # symlinks and executable bits that `simctl install` requires.
          # (The GitHub artifact wrapper strips exec permissions, so we must
          # ship our own zip — see the note in the workflow header.)
          ditto -c -k --keepParent App.app \
            so-i-quit-${{ steps.version.outputs.version }}-simulator.app.zip

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          # Note: GitHub wraps every artifact download in a zip, so the
          # download is so-i-quit-<v>-simulator.zip containing
          # so-i-quit-<v>-simulator.app.zip (this pre-made zip) containing
          # App.app — unzip twice. The two names differ on purpose.
          name: so-i-quit-${{ steps.version.outputs.version }}-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/so-i-quit-${{ steps.version.outputs.version }}-simulator.app.zip
          if-no-files-found: error
