apply plugin: 'com.android.application'

// Release signing. android/keystore.properties is gitignored — present only on
// machines that should produce signed release builds (local release machines
// and CI, where the workflow writes it from GitHub secrets). Without it, the
// release variant stays unsigned (historical local behavior).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.soiquit.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.soiquit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName "1.1.0"
        // versionCode derived from versionName: X.Y.Z -> X*10000 + Y*100 + Z (1.1.0 -> 10100).
        // Must monotonically increase per Google Play requirements; keep versionName in sync
        // with package.json and iOS MARKETING_VERSION (see AGENTS.md). Evaluated after
        // versionName above so the value is available at config time.
        versionCode versionName.split('\\.').collect { it as int }.inject(0) { acc, v -> acc * 100 + v }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed only when android/keystore.properties exists (see header).
            // CI (mobile-release.yml) writes it from GitHub secrets; without it
            // the APK/AAB is unsigned and must be signed manually (apksigner).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Dev identity: installs as com.soiquit.app.dev with its own label,
            // so it can coexist with the release/Play version (com.soiquit.app).
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "So I Quit (Dev)"
            resValue "string", "title_activity_main", "So I Quit (Dev)"
        }
        preview {
            // QA/sideload: installs as com.soiquit.app.preview, signed with the
            // debug keystore (installable on any device without a dedicated keystore).
            initWith release
            // Capacitor libs (capacitor-android, cordova plugins) only have debug/release —
            // without this, AGP fails with "Could not determine the dependencies of
            // task ':app:mergePreviewNativeLibs'".
            matchingFallbacks = ["release"]
            applicationIdSuffix ".preview"
            resValue "string", "app_name", "So I Quit"
            resValue "string", "title_activity_main", "So I Quit"
            signingConfig signingConfigs.debug
            versionNameSuffix "-preview"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
