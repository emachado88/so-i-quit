<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="120"
   height="120"
   viewBox="0 0 120 120"
   fill="none"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pulse line stroke gradient: dim origin -> bright, hopeful finish -->
    <linearGradient id="lineStroke" x1="19.621639" y1="60" x2="97.15" y2="26.141284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bdf3e6" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#e9fbf5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CF2D6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7CF2D6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulse line + dot only, transparent bg, rescaled into the adaptive-icon
       safe zone (center ~61%, the launcher mask crops to circle/squircle) -->
  <g transform="translate(60 60) scale(0.82) translate(-62.885 -55.155)">
    <!-- Glow pass behind the pulse line -->
    <path
       d="M 19.621639,60 H 30 l 3,12 3,-24 3,16 3,-4 h 28.873932 l 3,16 6,-32 6.406417,49.165775 10.86965,-67.024491"
       stroke="#4BE3C4"
       stroke-opacity="0.35"
       stroke-width="5.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none"
       filter="url(#softGlow)"/>

    <!-- Pulse line -->
    <path
       d="M 19.621639,60 H 30 l 3,12 3,-24 3,16 3,-4 h 28.873932 l 3,16 6,-32 6.406417,49.165775 10.86965,-67.024491"
       stroke="url(#lineStroke)"
       stroke-width="3.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none"/>

    <!-- Endpoint pulse dot -->
    <circle cx="97.15" cy="26.141284" r="9" fill="url(#dotGlow)"/>
    <circle cx="97.15" cy="26.141284" r="3.1" fill="#ffffff"/>
  </g>
</svg>
