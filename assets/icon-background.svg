<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="120"
   height="120"
   viewBox="0 0 120 120"
   fill="none"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: diagonal gradient from a lifted primary down into depth -->
    <linearGradient id="bg" x1="14" y1="6" x2="106" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22876f"/>
      <stop offset="0.5" stop-color="#1a6b5c"/>
      <stop offset="1" stop-color="#0f463f"/>
    </linearGradient>

    <!-- Soft glass sheen, top-left -->
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(30 20) rotate(48) scale(90 70)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom vignette for depth -->
    <linearGradient id="vignette" x1="60" y1="70" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a332e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a332e" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Adaptive background: full square (no rounded corners — the launcher mask crops it) -->
  <rect width="120" height="120" fill="url(#bg)"/>
  <rect width="120" height="120" fill="url(#vignette)"/>
  <rect width="120" height="120" fill="url(#sheen)"/>
</svg>
