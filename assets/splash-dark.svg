<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="2732"
   height="2732"
   viewBox="0 0 2732 2732"
   fill="none"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark-mode variant: same composition, deeper teal (app dark bg #0F0E0D family) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15594e"/>
      <stop offset="0.5" stop-color="#0f463f"/>
      <stop offset="1" stop-color="#072622"/>
    </linearGradient>

    <!-- Soft glass sheen, top-left (master coords × 22.77) — dimmer than light -->
    <radialGradient id="sheen" cx="0" cy="0" r="1"
      gradientTransform="translate(682.9 455.3) rotate(48) scale(2049 1594)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom vignette for depth -->
    <linearGradient id="vignette" x1="0" y1="0.583" x2="0" y2="1">
      <stop offset="0" stop-color="#041b18" stop-opacity="0"/>
      <stop offset="1" stop-color="#041b18" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Pulse line stroke gradient — 120-space coords, scaled by the group -->
    <linearGradient id="lineStroke" x1="19.621639" y1="60" x2="97.15" y2="26.141284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bdf3e6" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#e9fbf5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CF2D6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7CF2D6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Gradient + sheen + vignette, full canvas -->
  <rect width="2732" height="2732" fill="url(#bg)"/>
  <rect width="2732" height="2732" fill="url(#vignette)"/>
  <rect width="2732" height="2732" fill="url(#sheen)"/>

  <!-- Pulse line centered, ~25% of canvas width (9× master) -->
  <g transform="translate(1366 1366) scale(9) translate(-58.39 -55.155)">
    <path
       d="M 19.621639,60 H 30 l 3,12 3,-24 3,16 3,-4 h 28.873932 l 3,16 6,-32 6.406417,49.165775 10.86965,-67.024491"
       stroke="#4BE3C4"
       stroke-opacity="0.35"
       stroke-width="5.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none"
       filter="url(#softGlow)"/>

    <path
       d="M 19.621639,60 H 30 l 3,12 3,-24 3,16 3,-4 h 28.873932 l 3,16 6,-32 6.406417,49.165775 10.86965,-67.024491"
       stroke="url(#lineStroke)"
       stroke-width="3.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none"/>

    <circle cx="97.15" cy="26.141284" r="9" fill="url(#dotGlow)"/>
    <circle cx="97.15" cy="26.141284" r="3.1" fill="#ffffff"/>
  </g>
</svg>
